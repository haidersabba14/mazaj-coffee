name: Build iPhone IPA
on:
  workflow_dispatch:
    inputs:
      signed:
        description: Build signed IPA (requires Apple certificates)
        type: boolean
        default: false
jobs:
  archive:
    if: ${{ inputs.signed }}
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      APP_BUNDLE_ID: ${{ vars.APP_BUNDLE_ID }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      CERT_B64: ${{ secrets.APPLE_CERTIFICATE_P12_B64 }}
      CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      PROFILE_B64: ${{ secrets.APPLE_PROFILE_B64 }}
    steps:
      - uses: actions/checkout@v4
      - name: Require Apple signing configuration
        run: |
          test -n "$APP_BUNDLE_ID" && test -n "$APPLE_TEAM_ID"
          test -n "$CERT_B64" && test -n "$PROFILE_B64"
      - name: Install project generator
        run: command -v xcodegen || brew install xcodegen
      - name: Import signing material
        run: |
          set +x
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          printf '%s' "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          printf '%s' "$PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/mazaj.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/mazaj.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/mazaj.keychain-db"
          security import "$RUNNER_TEMP/signing.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$RUNNER_TEMP/mazaj.keychain-db"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/mazaj.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/mazaj.keychain-db" login.keychain-db
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
      - name: Generate and archive
        working-directory: ios
        run: |
          xcodegen generate
          xcodebuild -project MazajAdmin.xcodeproj -scheme MazajAdmin -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/MazajAdmin.xcarchive" archive CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$APPLE_TEAM_ID" PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" CODE_SIGN_IDENTITY='Apple Distribution'
      - name: Export IPA for registered devices
        run: |
          python3 - <<'PY'
          import os, plistlib
          options = {'method':'release-testing','signingStyle':'manual','teamID':os.environ['APPLE_TEAM_ID'],'provisioningProfiles':{os.environ['APP_BUNDLE_ID']:os.environ['PROFILE_UUID']}}
          with open(os.environ['RUNNER_TEMP']+'/ExportOptions.plist','wb') as f: plistlib.dump(options,f)
          PY
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/MazajAdmin.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: MazajAdmin-IPA
          path: ${{ runner.temp }}/ipa/*.ipa
          retention-days: 3
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/mazaj.keychain-db" || true
          rm -f "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

  unsigned:
    if: ${{ !inputs.signed }}
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      APP_BUNDLE_ID: ${{ vars.APP_BUNDLE_ID || 'com.mazaj.coffee.admin' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install project generator
        run: command -v xcodegen || brew install xcodegen
      - name: Build iOS app without signing
        working-directory: ios
        run: |
          xcodegen generate
          xcodebuild -project MazajAdmin.xcodeproj -scheme MazajAdmin -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build build CODE_SIGNING_ALLOWED=NO
          mkdir -p build/ipa/Payload
          cp -R build/Build/Products/Release-iphoneos/MazajAdmin.app build/ipa/Payload/
          cd build/ipa
          zip -qry MazajAdmin-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: MazajAdmin-UNSIGNED-IPA-needs-signing
          path: ios/build/ipa/MazajAdmin-unsigned.ipa
          retention-days: 7
