name: Coffee Royal Manager IPA
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        default: '3.1.1'
      signed:
        description: Signed IPA (requires Apple secrets; default unsigned)
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: royal-manager-release
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
  ios:
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      APP_BUNDLE_ID: ${{ vars.ROYAL_BUNDLE_ID || 'com.coffeeroyal.manager' }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      VERSION: ${{ inputs.version }}
      CERT_B64: ${{ secrets.APPLE_CERTIFICATE_P12_B64 }}
      CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      PROFILE_B64: ${{ secrets.APPLE_PROFILE_B64 }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate version
        run: '[[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - name: Install XcodeGen
        run: command -v xcodegen || brew install xcodegen
      - name: Generate full Xcode project
        working-directory: ios-manager
        run: xcodegen generate
      - name: Run native simulator tests
        working-directory: ios-manager
        run: |
          set -o pipefail
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for v in d["devices"].values() for x in v if "iPhone" in x["name"]))')
          xcodebuild test -project CoffeeRoyalManager.xcodeproj -scheme CoffeeRoyalManager -configuration Debug -destination "platform=iOS Simulator,id=$SIM_ID" -resultBundlePath build/Tests.xcresult CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/royal-tests.log"
      - name: Validate and import Apple signing (optional)
        if: ${{ inputs.signed }}
        run: |
          set +x
          test -n "$APPLE_TEAM_ID" && test -n "$CERT_B64" && test -n "$PROFILE_B64"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          printf '%s' "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          printf '%s' "$PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/royal.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/royal.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/royal.keychain-db"
          security import "$RUNNER_TEMP/signing.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$RUNNER_TEMP/royal.keychain-db"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/royal.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/royal.keychain-db" login.keychain-db
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          python3 scripts/check-apple-profile.py "$RUNNER_TEMP/profile.plist"
      - name: Build unsigned device IPA
        if: ${{ !inputs.signed }}
        working-directory: ios-manager
        run: |
          set -o pipefail
          xcodebuild -project CoffeeRoyalManager.xcodeproj -scheme CoffeeRoyalManager -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build build CODE_SIGNING_ALLOWED=NO MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" 2>&1 | tee "$RUNNER_TEMP/royal-build.log"
          mkdir -p build/ipa/Payload
          cp -R build/Build/Products/Release-iphoneos/CoffeeRoyalManager.app build/ipa/Payload/
          cd build/ipa
          zip -qry CoffeeRoyalManager-UNSIGNED.ipa Payload
      - name: Archive and export signed IPA
        if: ${{ inputs.signed }}
        working-directory: ios-manager
        run: |
          set -o pipefail
          xcodebuild -project CoffeeRoyalManager.xcodeproj -scheme CoffeeRoyalManager -configuration Release -destination 'generic/platform=iOS' -archivePath build/CoffeeRoyalManager.xcarchive archive DEVELOPMENT_TEAM="$APPLE_TEAM_ID" PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" CODE_SIGN_IDENTITY='Apple Distribution' MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" CODE_SIGN_ENTITLEMENTS="$RUNNER_TEMP/royal.entitlements" 2>&1 | tee "$RUNNER_TEMP/royal-build.log"
          xcodebuild -exportArchive -archivePath build/CoffeeRoyalManager.xcarchive -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath build/ipa
      - name: Package source project and build metadata
        run: |
          python3 - <<'PY'
          import os,json,datetime,pathlib
          meta={'version':os.environ['VERSION'],'build':os.environ['GITHUB_RUN_NUMBER'],'commit':os.environ['GITHUB_SHA'],'built_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'signed':'${{ inputs.signed }}'=='true','install_note':'Unsigned IPA requires signing before installation.'}
          pathlib.Path('ios-manager/build/ipa/build-info.json').write_text(json.dumps(meta,indent=2))
          PY
          zip -qry ios-manager/build/ipa/CoffeeRoyalManager-Xcode.zip ios-manager/CoffeeRoyalManager.xcodeproj ios-manager/CoffeeRoyalManager ios-manager/Tests ios-manager/project.yml ios-manager/README.md
      - uses: actions/upload-artifact@v4
        with:
          name: CoffeeRoyalManager-IPA-${{ inputs.signed && 'SIGNED' || 'UNSIGNED' }}
          path: ios-manager/build/ipa/*
          retention-days: 14
      - name: Create GitHub Release and attach IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="royal-manager-v$VERSION-${{ github.run_number }}"
          printf '%s\n' '# COFFEE ROYAL MANAGER' '' 'Native SwiftUI app with secure Cloudflare APIs, order preparation, customer calling, inventory and admin loyalty scanning.' '' 'Signing: ${{ inputs.signed && 'SIGNED — limited by the provisioning profile' || 'UNSIGNED — requires signing before installation' }}.' '' 'APNs requires configured Apple credentials. Web Push works separately for supported installed web apps.' '' 'Build metadata: build-info.json. Native tests and logs are available in Actions.' > "$RUNNER_TEMP/release-notes.md"
          gh release create "$TAG" ios-manager/build/ipa/*.ipa ios-manager/build/ipa/CoffeeRoyalManager-Xcode.zip ios-manager/build/ipa/build-info.json --title "Coffee Royal Manager $VERSION · build ${{ github.run_number }}" --notes-file "$RUNNER_TEMP/release-notes.md" --target "$GITHUB_SHA"
      - name: Save diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CoffeeRoyalManager-build-diagnostics
          path: |
            ${{ runner.temp }}/royal-*.log
            ios-manager/build/Tests.xcresult
          retention-days: 7
      - name: Remove signing material
        if: ${{ always() && inputs.signed }}
        run: |
          security delete-keychain "$RUNNER_TEMP/royal.keychain-db" || true
          rm -f "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
