name: Attach verified project files
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Coffee Royal release tag
        required: true
        default: royal-manager-v3.3.0-7
permissions:
  contents: write
jobs:
  attach:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate release and package tracked source
        run: |
          [[ "$RELEASE_TAG" =~ ^royal-manager-v[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]]
          gh release view "$RELEASE_TAG"
          git archive --format=zip --output="$RUNNER_TEMP/coffee-royal-source.zip" HEAD
      - name: Attach source, feature register and test report
        run: gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/coffee-royal-source.zip" docs/TEST-REPORT.md docs/FEATURES-2331.md docs/RELEASE-3.3.md docs/REQUESTED-FEATURES.md --clobber
