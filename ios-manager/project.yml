name: CoffeeRoyalManager
options:
  bundleIdPrefix: com.coffeeroyal
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '3.1.0'
    CURRENT_PROJECT_VERSION: 3
    DEVELOPMENT_TEAM: ${APPLE_TEAM_ID}
    CODE_SIGN_STYLE: Manual
targets:
  CoffeeRoyalManager:
    type: application
    platform: iOS
    sources: [CoffeeRoyalManager]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${APP_BUNDLE_ID}
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: COFFEE ROYAL MANAGER
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.business
        INFOPLIST_KEY_NSFaceIDUsageDescription: فتح جلسة الإدارة المحفوظة بأمان بعد تسجيل الدخول الأول
        INFOPLIST_KEY_NSCameraUsageDescription: مسح بطاقة الولاء لإضافة ختم من الإدارة
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: '1,2'
    scheme:
      testTargets: [CoffeeRoyalManagerTests]
  CoffeeRoyalManagerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: CoffeeRoyalManager
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.coffeeroyal.manager.tests
